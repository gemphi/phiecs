[package]
name = "phiecs"
version = "0.1.0"
edition = "2024"
description = "An entity-component-system for language: words as entities, relations as edges, conditions as state, and a quest that learns them by asking."

[dependencies]
# The one seed (docs/159): a word's starting angles come from phinet so the
# same word has the same angles in every phasor of the workspace.
phistd = { path = "../phistd" }
# The spectral phasor (phasor/spectral): its fine-structure phase and colour
# come from phiton, and a lexicon stores it with serde.
phiton = { path = "../phiton" }
# The helix writes each channel's code (phasor/facet/helix, phical::helix::Codon).
phical = { path = "../phical" }
serde = { version = "1.0", features = ["derive"] }
# The facet's wave reads (phasor/wave): the ray cast scores the lexicon in parallel.
rayon = "1.8"
# The facet's .chroma files (phasor/facet/storage).
bincode = "1.3"

[dev-dependencies]
# The relation vocabulary's round trip through its stored form.
serde_json = "1"
# Dev-only (cargo allows the cycle): the kit's face test reads frames back
# through phient's prose Knowing.
phient = { path = "../phient" }
